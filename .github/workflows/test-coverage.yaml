# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Run the browser tests too; they are skipped on CRAN.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Test coverage
        env:
          CHROMOTE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          cov <- covr::package_coverage(type = "tests", quiet = FALSE)
          pct <- covr::percent_coverage(cov)
          # Per-file figures. (print(cov) would need rstudioapi for its markers.)
          d <- covr::tally_coverage(cov, by = "line")
          print(aggregate(list(coverage = d$value), list(file = d$filename),
                          function(v) round(100 * mean(v > 0), 1)), row.names = FALSE)
          zero <- covr::zero_coverage(cov)
          if (nrow(zero) > 0) {
            cat("\nUncovered lines:\n")
            print(zero[, c("filename", "functions", "line")], row.names = FALSE)
          }
          cat(sprintf("\nR line coverage: %.1f%%\n", pct))
          cat(sprintf("### R line coverage: %.1f%%\n", pct),
              file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
        shell: Rscript {0}
